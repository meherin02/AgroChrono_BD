services:
  mongo:
    image: mongo:8
    volumes: [agro-data:/data/db]
  ml-service:
    build: { context: ., dockerfile: ml-service/Dockerfile }
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set a local internal token}
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: agrochrono
      SESSION_SECRET: ${SESSION_SECRET:?Set at least 32 random characters}
      APP_ORIGIN: http://localhost:3000
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set a local internal token}
    depends_on: [mongo, ml-service]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  agro-data:
