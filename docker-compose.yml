version: '3.8'

services:
  ml-service:
    build: ./ml-service
    container_name: agrochrono-ml
    ports:
      - "8001:8001"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: agrochrono-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - ML_SERVICE_URL=http://ml-service:8001
      # Optional: set your MongoDB Atlas connection string below:
      # - MONGODB_URI=mongodb+srv://<username>:<password>@cluster.mongodb.net/agrochrono
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agrochrono-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
