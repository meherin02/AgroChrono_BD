name: Farmer application verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27029:27017"]
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27029
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci && npm --prefix backend ci && npm --prefix frontend ci
      - run: pip install -r ml-service/requirements.txt
      - run: python ml-service/test_inference.py
      - run: npm test
      - run: npm run format:check && npm run test:translations && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-verification-evidence
          path: .local/evidence
