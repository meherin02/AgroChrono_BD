name: AgroChrono-BD CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ml-service-test:
    name: Test Python ML Service (FastAPI & Isolation Forest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: |
          cd ml-service
          pip install -r requirements.txt
      - name: Train & Validate Isolation Forest Model
        run: |
          cd ml-service
          python model/train_model.py
          python test_inference.py

  backend-test:
    name: Test Express Backend & Conflict Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies & test syntax
        run: |
          cd backend
          npm ci
          node -e "require('./src/data/bangladeshDistricts.js'); require('./src/data/referenceCalendars.json'); console.log('✓ Datasets verified!');"

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies & build
        run: |
          cd frontend
          npm ci
          npm run build
